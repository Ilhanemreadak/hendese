# Build, unit tests and the Playwright suite (cleanliness, axe, behaviour, visual) on every push and pull request.
# The job runs inside the official Playwright image, so the Linux visual baselines
# (tests/e2e/*-snapshots/*-linux.png) match what `docker run mcr.microsoft.com/playwright:v1.63.0-noble` produces locally.
name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    container: mcr.microsoft.com/playwright:v1.63.0-noble
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - run: git config --global --add safe.directory "$GITHUB_WORKSPACE"
      - run: npm ci
      - run: npm run build
      # dist/ and demos/ are committed: a stale build output fails the run
      - run: git diff --exit-code -- dist demos
      - run: npm run test:unit
      - run: npx playwright test
      - if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-results
          path: test-results/
          retention-days: 7
