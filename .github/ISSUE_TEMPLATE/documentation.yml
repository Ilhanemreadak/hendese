name: Documentation
description: Something in the README, docs pages or part pages is wrong, unclear or missing.
title: "[Docs]: "
labels: ["documentation", "needs-triage"]
body:
  - type: input
    id: where
    attributes:
      label: Page
      placeholder: "docs/motion.html, section 03"
    validations:
      required: true
  - type: textarea
    id: issue
    attributes:
      label: What is wrong or missing?
    validations:
      required: true
  - type: textarea
    id: suggestion
    attributes:
      label: Suggested wording
